name: Rust CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v4
      - name: Check release tooling and versions
        run: |
          python3 scripts/version.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          test "$(nix eval .#default.version --raw)" = "$(python3 scripts/version.py)"
      - name: Check formatting and lints
        run: nix develop --command make check-gui
      - name: Run tests
        run: nix develop --command make test-gui
