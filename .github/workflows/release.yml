name: Build, cache and release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      cache_only:
        description: Populate the cache without publishing a release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  plan:
    needs: check
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: python3 scripts/version.py --release-plan >> "$GITHUB_OUTPUT"

  cache:
    needs: plan
    runs-on: ubuntu-24.04
    outputs:
      cli: ${{ steps.build.outputs.cli }}
      gui: ${{ steps.build.outputs.gui }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v4
      - uses: cachix/cachix-action@v17
        with:
          name: kabilan108
          skipPush: true
      - name: Build the CLI and GUI
        id: build
        run: |
          nix build .#default --out-link result-cli -L
          nix build .#gui --out-link result-gui -L
          test "$(result-cli/bin/dictator version)" = "$(python3 scripts/version.py)"
          echo "cli=$(readlink -f result-cli)" >> "$GITHUB_OUTPUT"
          echo "gui=$(readlink -f result-gui)" >> "$GITHUB_OUTPUT"
      - name: Upload application runtime closures only
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          test -n "$CACHIX_AUTH_TOKEN" || { echo 'Configure the CACHIX_AUTH_TOKEN repository secret'; exit 1; }
          cachix push kabilan108 "$(readlink -f result-cli)" "$(readlink -f result-gui)"

  verify-cache:
    needs: [plan, cache]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v4
      - uses: cachix/cachix-action@v17
        with:
          name: kabilan108
          skipPush: true
      - name: Download both packages on a fresh runner with builds disabled
        env:
          CLI: ${{ needs.cache.outputs.cli }}
          GUI: ${{ needs.cache.outputs.gui }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # Verify the roots are in our cache, then substitute their closures.
          nix path-info --store https://kabilan108.cachix.org "$CLI" "$GUI"
          nix build .#default --out-link result-cli --max-jobs 0 --builders '' -L
          nix build .#gui --out-link result-gui --max-jobs 0 --builders '' -L
          test "$(readlink -f result-cli)" = "$CLI"
          test "$(readlink -f result-gui)" = "$GUI"
          test "$(result-cli/bin/dictator version)" = "$VERSION"
          test -x result-gui/bin/dictator-gui

  cli-archive:
    needs: [plan, verify-cache]
    if: needs.plan.outputs.release == 'true' && inputs.cache_only != true
    runs-on: ubuntu-22.04
    env:
      DICTATOR_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Build CLI outside Nix
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          cargo +1.94.0 build --locked --release --bin dictator
          test "$(target/release/dictator version)" = "$DICTATOR_VERSION"
          mkdir -p release-assets/package
          cp target/release/dictator LICENSE release-assets/package/
          cp docs/cli-install.md release-assets/package/README.md
          tar -C release-assets/package -czf "release-assets/dictator-${DICTATOR_VERSION}-x86_64-linux.tar.gz" .
          cd release-assets
          sha256sum "dictator-${DICTATOR_VERSION}-x86_64-linux.tar.gz" > SHA256SUMS
      - name: Test the archive in Ubuntu without Nix
        run: |
          docker run --rm -v "$PWD/release-assets:/release:ro" \
            -e DICTATOR_VERSION ubuntu:22.04 bash -euc '
              mkdir /tmp/dictator
              tar -xzf "/release/dictator-${DICTATOR_VERSION}-x86_64-linux.tar.gz" -C /tmp/dictator
              test "$(/tmp/dictator/dictator version)" = "$DICTATOR_VERSION"
              /tmp/dictator/dictator --help
              /tmp/dictator/dictator completion bash > /tmp/completion
              test -s /tmp/completion
            '
      - uses: actions/upload-artifact@v4
        with:
          name: cli-release
          path: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: [plan, verify-cache, cli-archive]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: cli-release
          path: release-assets
      - name: Publish this exact commit, resuming incomplete releases
        run: bash scripts/publish-release.sh

  notify:
    needs: [check, plan, cache, verify-cache, cli-archive, publish]
    if: always() && (failure() || needs.publish.result == 'success')
    runs-on: ubuntu-24.04
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: Report release outcome
        if: env.DISCORD_WEBHOOK != ''
        uses: Kabilan108/actions/discord-notify@v1
        with:
          webhook-url: ${{ env.DISCORD_WEBHOOK }}
          title: ${{ needs.publish.result == 'success' && 'Dictator release complete' || 'Dictator build or release failed' }}
          description: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          level: ${{ needs.publish.result == 'success' && 'success' || 'error' }}
