[package]
name = "dictator"
version = "2.4.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "native speech to text daemon for linux"
homepage = "https://github.com/kabilan108/dictator"
repository = "https://github.com/kabilan108/dictator"
build = "build.rs"

[lib]
name = "dictator"
path = "src/lib.rs"

[[bin]]
name = "dictator"
path = "src/main.rs"

[dependencies]
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "fmt", "std", "registry"] }
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
gpui = { version = "=0.2.2", optional = true }
gpui-component = { version = "=0.5.1", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1

[features]
default = []
gui = ["dep:gpui", "dep:gpui-component"]

[[bin]]
name = "dictator-gui"
path = "src/bin/dictator-gui.rs"
required-features = ["gui"]
