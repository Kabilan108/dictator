[package]
name = "dictator"
version = "3.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "native speech to text daemon for linux"
homepage = "https://github.com/kabilan108/dictator"
repository = "https://github.com/kabilan108/dictator"
build = "build.rs"

[lib]
name = "dictator"
path = "src/lib.rs"

[[bin]]
name = "dictator"
path = "src/main.rs"

[dependencies]
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "fmt", "std", "registry"] }
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
rune = { git = "https://github.com/anomalyco/rune.git", rev = "4fbd2d6ac4dd12595dd8ed0b7849b28a309c7c00", optional = true }
rune-kit = { git = "https://github.com/anomalyco/rune.git", rev = "4fbd2d6ac4dd12595dd8ed0b7849b28a309c7c00", optional = true }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune.git", rev = "4fbd2d6ac4dd12595dd8ed0b7849b28a309c7c00", optional = true }
futures-util = { version = "0.3", default-features = false }
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1

[features]
default = []
gui = ["dep:rune", "dep:rune-kit", "dep:rune-theme-opencode"]

[[bin]]
name = "dictator-gui"
path = "src/bin/dictator-gui.rs"
required-features = ["gui"]
